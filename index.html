function initArt(){const box=$('#ar');bindUrl($('form',box),site=>{box.innerHTML=`<div class="stp" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i></div><h1 style="font-size:2rem;margin-bottom:8px">Choose topics</h1><p class="sm" style="margin-bottom:20px">Step 2 of 3 \u2013 Sample topics for <b id="sn"></b>.</p><form class="topics" id="tf">${TOP.map((t,i)=>`<label><input type="checkbox" checked value="${i}"><span>${t[0]}</span></label>`).join('')}<p class="fe" id="te"></p><button class="btn b1" type="submit" style="margin-top:8px">Generate articles ${ar()}</button></form>`;$('#sn').textContent=site;
 $('#tf').onsubmit=e=>{e.preventDefault();const sel=$$('input:checked',e.target).map(i=>+i.value);if(!sel.length){$('#te').textContent='Choose at least one topic.';return}
  runSteps(['Researching','Planning','Writing','Optimizing'],()=>{box.innerHTML=`<div class="stp" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></div><span class="demo">Sample articles \u2013 demo content, no AI backend connected</span><h1 style="font-size:2rem;margin-bottom:20px">Your articles</h1><div style="display:grid;gap:16px">${sel.map(i=>`<article class="card ar"><span class="tag m">${TOP[i][1]}</span><h3>${TOP[i][0]}</h3><p>${TOP[i][2]}</p><div class="pv">Preview: sample opening paragraph for ${site}. Real articles are written in your brand voice once connected.</div></article>`).join('')}</div><div class="cta" style="margin-top:24px"><a class="btn b1" href="#/signup?plan=grow">Start growing with RepGet ${ar()}</a></div>`;window.scrollTo(0,0)},900)}})}
function initRes(){const r=$('#rg');if(r)setTimeout(()=>{},0);$$('.bar i').forEach(b=>setTimeout(()=>b.style.width=b.dataset.w+'%',60));$('#vr').onclick=()=>$('.g3').scrollIntoView({behavior:'smooth',block:'center'})}
/* header + menu */
const dr=$('#dr');function closeMenu(){dr.classList.remove('on');dr.setAttribute('aria-hidden','true');$('#mb').setAttribute('aria-expanded','false');document.body.style.overflow=''}
$('#mb').onclick=()=>{dr.classList.add('on');dr.setAttribute('aria-hidden','false');$('#mb').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';$('#mx').focus()};
$('#mx').onclick=()=>{closeMenu();$('#mb').focus()};dr.onclick=e=>{if(e.target===dr)closeMenu()};addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
addEventListener('scroll',()=>$('#hd').classList.toggle('s',scrollY>8),{passive:true});
addEventListener('hashchange',route);route();
</script>
</body>
